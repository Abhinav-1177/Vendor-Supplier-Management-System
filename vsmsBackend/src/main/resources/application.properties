spring.application.name=vsmsBackend
server.port=8080

# Create the database first: CREATE DATABASE supplybridge;
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/supplybridge?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Dev only: Hibernate creates and updates the tables from the entity classes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Set JWT_SECRET to a random value of at least 32 characters.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=24

# Set ADMIN_PASSWORD before first startup to create the initial admin account.
app.admin.email=${ADMIN_EMAIL:admin@supplybridge.com}
app.admin.password=${ADMIN_PASSWORD:}

# Frontend origin allowed by CORS (Vite dev server).
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
